version: "3.9"

services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_DB: db_senai
            POSTGRES_USER: usr_senai
            POSTGRES_PASSWORD: usr_senai
        ports:
            - "54320:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
